backend:
  name: github
  repo: lakapple/lingualearn
  branch: main
  base_url: https://lingualearn-oauth.trieukha-lakapple.workers.dev

site_url: https://lingualearn-delta.vercel.app

media_folder: "public/uploads"
public_folder: "/uploads"

i18n:
  structure: multiple_files
  locales: [vi, en]
  default_locale: vi

collections:
  - name: concepts
    label: "Thuật ngữ Wiki"
    folder: src/content/concepts
    path: "{{slug}}/index"
    extension: mdx
    format: frontmatter
    create: true
    i18n: true
    fields:
      - { label: "Tiêu đề", name: title, widget: string, i18n: true }
      - { label: "Mô tả ngắn", name: description, widget: text, i18n: true }
      - { label: "Phiên âm IPA", name: phonetic, widget: string, required: false, i18n: true, hint: "Ví dụ /ɗiəm˧˧/ hoặc /pɔɪnt/" }
      - { label: "Tóm tắt (dùng cho tooltip)", name: summary, widget: text, required: false, i18n: true }
      - { label: "Tags", name: tags, widget: list, i18n: true }
      - { label: "Ngày cập nhật", name: updatedDate, widget: datetime, required: false }
      - { label: "Nháp (chưa đăng)", name: draft, widget: boolean, default: false }
      - { label: "Nội dung", name: body, widget: markdown, i18n: true }

  - name: lessons_10
    label: "Toán 10"
    folder: src/content/subject/math/lessons/lop-10
    path: "{{slug}}/index"
    extension: mdx
    format: frontmatter
    create: true
    i18n: true
    fields:
      - { label: "Tiêu đề", name: title, widget: string, i18n: true }
      - { label: "Mô tả ngắn", name: description, widget: text, i18n: true }
      - { label: "Tags", name: tags, widget: list, i18n: true }
      - { label: "Khối lớp", name: grade, widget: number, value_type: int, default: 10 }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 0 }
      - { label: "Ngày cập nhật", name: updatedDate, widget: datetime, required: false }
      - { label: "Nháp (chưa đăng)", name: draft, widget: boolean, default: false }
      - { label: "Nội dung", name: body, widget: markdown, i18n: true }

  - name: lessons_11
    label: "Toán 11"
    folder: src/content/subject/math/lessons/lop-11
    path: "{{slug}}/index"
    extension: mdx
    format: frontmatter
    create: true
    i18n: true
    fields:
      - { label: "Tiêu đề", name: title, widget: string, i18n: true }
      - { label: "Mô tả ngắn", name: description, widget: text, i18n: true }
      - { label: "Tags", name: tags, widget: list, i18n: true }
      - { label: "Khối lớp", name: grade, widget: number, value_type: int, default: 11 }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 0 }
      - { label: "Ngày cập nhật", name: updatedDate, widget: datetime, required: false }
      - { label: "Nháp (chưa đăng)", name: draft, widget: boolean, default: false }
      - { label: "Nội dung", name: body, widget: markdown, i18n: true }

  - name: lessons_12
    label: "Toán 12"
    folder: src/content/subject/math/lessons/lop-12
    path: "{{slug}}/index"
    extension: mdx
    format: frontmatter
    create: true
    i18n: true
    fields:
      - { label: "Tiêu đề", name: title, widget: string, i18n: true }
      - { label: "Mô tả ngắn", name: description, widget: text, i18n: true }
      - { label: "Tags", name: tags, widget: list, i18n: true }
      - { label: "Khối lớp", name: grade, widget: number, value_type: int, default: 12 }
      - { label: "Thứ tự hiển thị", name: order, widget: number, value_type: int, default: 0 }
      - { label: "Ngày cập nhật", name: updatedDate, widget: datetime, required: false }
      - { label: "Nháp (chưa đăng)", name: draft, widget: boolean, default: false }
      - { label: "Nội dung", name: body, widget: markdown, i18n: true }
